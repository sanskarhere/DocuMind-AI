<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create Account — DocuMind AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:#0F0F1A;color:#fff;min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;
    background-image:radial-gradient(circle at 20% 20%, rgba(124,58,237,.18), transparent 50%),radial-gradient(circle at 80% 80%, rgba(124,58,237,.12), transparent 50%);
  }
  .card{
    width:100%;max-width:440px;background:#1A1A2E;
    border:1px solid rgba(124,58,237,.2);border-radius:16px;
    padding:32px 28px;box-shadow:0 20px 60px -10px rgba(124,58,237,.35);
  }
  .brand{text-align:center;margin-bottom:24px}
  .brand h1{margin:0;font-size:24px;font-weight:700;background:linear-gradient(135deg,#fff,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand .dot{color:#7C3AED}
  .brand p{margin:6px 0 0;font-size:13px;color:#9ca3af}
  .field{margin-bottom:14px}
  label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:#d1d5db}
  input{
    width:100%;padding:12px 14px;background:#252540;
    border:1px solid transparent;border-radius:10px;color:#fff;
    font-size:14px;font-family:inherit;outline:none;transition:border-color .15s;
  }
  input::placeholder{color:#6b7280}
  input:focus{border-color:#7C3AED}
  .error{color:#F87171;font-size:12px;margin-top:6px;min-height:14px;display:block}
  .strength{margin-top:8px}
  .strength-bar{height:6px;background:#252540;border-radius:4px;overflow:hidden}
  .strength-fill{height:100%;width:0%;background:#F87171;transition:width .25s,background .25s}
  .strength-label{font-size:11px;color:#9ca3af;margin-top:4px;display:block;min-height:14px}
  .btn{
    width:100%;padding:12px 16px;border:none;border-radius:10px;
    background:#7C3AED;color:#fff;font-weight:600;font-size:15px;
    cursor:pointer;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;
    transition:background .15s;
  }
  .btn:hover:not(:disabled){background:#6d28d9}
  .btn:disabled{opacity:.7;cursor:not-allowed}
  .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .footer{text-align:center;margin-top:18px;font-size:13px;color:#9ca3af}
  .footer a{color:#a78bfa;text-decoration:none;font-weight:500}
  .footer a:hover{text-decoration:underline}
  .success{
    background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4);
    color:#4ade80;padding:12px;border-radius:10px;text-align:center;
    margin-top:12px;font-size:14px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <h1>DocuMind<span class="dot"> AI</span></h1>
      <p>Chat with your documents, instantly.</p>
    </div>
    <form id="registerForm" novalidate>
      <div class="field">
        <label for="name">Full Name</label>
        <input id="name" type="text" placeholder="Enter your full name" autocomplete="name" />
        <span class="error" id="nameError"></span>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="Enter your email" autocomplete="email" />
        <span class="error" id="emailError"></span>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Create a password" autocomplete="new-password" />
        <div class="strength">
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
          <span class="strength-label" id="strengthLabel"></span>
        </div>
        <span class="error" id="passwordError"></span>
      </div>
      <div class="field">
        <label for="confirm">Confirm Password</label>
        <input id="confirm" type="password" placeholder="Confirm your password" autocomplete="new-password" />
        <span class="error" id="confirmError"></span>
      </div>
      <button class="btn" type="submit" id="submitBtn">
        <span id="btnLabel">Create Account</span>
      </button>
      <div id="successMsg" class="success" style="display:none">Account created! Redirecting to login...</div>
    </form>
    <div class="footer">
      Already have an account? <a href="login.html">Sign In →</a>
    </div>
  </div>
<script>
  const form = document.getElementById('registerForm');
  const nameEl = document.getElementById('name');
  const emailEl = document.getElementById('email');
  const passEl = document.getElementById('password');
  const confirmEl = document.getElementById('confirm');
  const errs = {
    name: document.getElementById('nameError'),
    email: document.getElementById('emailError'),
    password: document.getElementById('passwordError'),
    confirm: document.getElementById('confirmError'),
  };
  const fill = document.getElementById('strengthFill');
  const sLabel = document.getElementById('strengthLabel');
  const btn = document.getElementById('submitBtn');
  const btnLabel = document.getElementById('btnLabel');
  const success = document.getElementById('successMsg');
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function scorePassword(p){
    let s = 0;
    if(p.length >= 8) s++;
    if(/[A-Z]/.test(p) && /[a-z]/.test(p)) s++;
    if(/\d/.test(p)) s++;
    if(/[^A-Za-z0-9]/.test(p)) s++;
    return s;
  }
  passEl.addEventListener('input',()=>{
    const p = passEl.value;
    if(!p){fill.style.width='0%';sLabel.textContent='';return;}
    const s = scorePassword(p);
    let pct=25,color='#F87171',label='Weak';
    if(s>=4){pct=100;color='#4ade80';label='Strong';}
    else if(s>=3){pct=75;color='#a78bfa';label='Strong';}
    else if(s>=2){pct=50;color='#fbbf24';label='Medium';}
    fill.style.width=pct+'%';fill.style.background=color;sLabel.textContent=label;sLabel.style.color=color;
  });

  function validate(){
    let ok=true;
    Object.values(errs).forEach(e=>e.textContent='');
    if(!nameEl.value.trim()){errs.name.textContent='Full name is required';ok=false;}
    const email = emailEl.value.trim();
    if(!email){errs.email.textContent='Email is required';ok=false;}
    else if(!emailRegex.test(email)){errs.email.textContent='Please enter a valid email';ok=false;}
    if(!passEl.value){errs.password.textContent='Password is required';ok=false;}
    else if(passEl.value.length<8){errs.password.textContent='Password must be at least 8 characters';ok=false;}
    if(!confirmEl.value){errs.confirm.textContent='Please confirm your password';ok=false;}
    else if(confirmEl.value!==passEl.value){errs.confirm.textContent='Passwords do not match';ok=false;}
    return ok;
  }

  form.addEventListener('submit',(e)=>{
    e.preventDefault();
    if(!validate()) return;
    btn.disabled = true;
    btnLabel.textContent='Creating account';
    const sp=document.createElement('span');sp.className='spinner';btn.appendChild(sp);
    setTimeout(()=>{
      success.style.display='block';
      setTimeout(()=>{ window.location.href='login.html'; },1500);
    },300);
  });

  [nameEl,emailEl,passEl,confirmEl].forEach((el,i)=>{
    el.addEventListener('input',()=>{
      const keys=['name','email','password','confirm'];
      errs[keys[i]].textContent='';
    });
  });
</script>
</body>
</html>
